name: Noodle
description: 'Noodle is a Brazilian fintech building financial infrastructure for the creator economy. It
  provides automated payouts to creators, influencers, and vendors; FastPay early access to future earnings;
  noodleOS, a unified platform for campaigns, creator data, payments, and asset tracking; global payouts
  powered by Ebanx; foreign-exchange settlement; and credit and capital products underwritten in part on a
  creator''s social presence. Backed by QED Investors, Noodle serves media companies, agencies, and platforms
  that pay content creators. The company references API-based integrations but publishes no public developer
  portal or API documentation.'
